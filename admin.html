<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VBIB Questionnaire Submissions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <div>
        <h1>Questionnaire Submissions</h1>
        <p style="font-size:13px;opacity:0.8;margin-top:4px">VBIB Packaging Line</p>
      </div>
      <div class="admin-actions">
        <label class="btn btn-secondary" style="cursor:pointer">
          Import JSON
          <input type="file" accept=".json" onchange="importJSON(event)" style="display:none">
        </label>
        <button class="btn btn-primary" onclick="exportAll()">Export All</button>
      </div>
    </div>

    <div id="submissions-list"></div>
  </div>

  <script>
    const SUBMISSIONS_KEY = 'vbib_submissions';

    function getSubmissions() {
      return JSON.parse(localStorage.getItem(SUBMISSIONS_KEY) || '[]');
    }

    function renderSubmissions() {
      const list = document.getElementById('submissions-list');
      const submissions = getSubmissions();

      if (submissions.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128203;</div>
            <h3>No submissions yet</h3>
            <p>Submissions will appear here when customers complete the questionnaire.<br>
            You can also import JSON files using the button above.</p>
          </div>`;
        return;
      }

      list.innerHTML = submissions.map((s, idx) => {
        const pp = s.productProperties || {};
        const pkg = s.packagingSpecs || {};
        const proc = s.processParameters || {};
        const date = s.submittedAt ? new Date(s.submittedAt).toLocaleString() : 'Unknown';

        const primaryBagsHtml = (pkg.primaryBags || [])
          .filter(b => b.weight)
          .map(b => `<span style="margin-right:12px"><strong>${b.bag}:</strong> ${b.weight}</span>`)
          .join('');

        const masterBagsHtml = (pkg.masterBags || [])
          .filter(b => b.combination)
          .map(b => `<span style="margin-right:12px"><strong>${b.bag}:</strong> ${b.combination}</span>`)
          .join('');

        return `
        <div class="admin-card">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div>
              <h3>#${idx + 1} - ${pp.productDescription ? pp.productDescription.slice(0, 60) : 'No description'}${pp.productDescription && pp.productDescription.length > 60 ? '...' : ''}</h3>
              <div class="meta">Submitted: ${date} | ID: ${s.id || 'N/A'}</div>
            </div>
            <div class="admin-actions">
              <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px" onclick="downloadOne(${idx})">Download</button>
              <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;color:#dc2626" onclick="deleteOne(${idx})">Delete</button>
            </div>
          </div>

          <details>
            <summary style="cursor:pointer;font-weight:600;color:#2d5a8e;margin-bottom:12px">View Details</summary>

            <h4 style="color:#1a365d;margin:12px 0 8px;font-size:14px">Part 1: Product Properties</h4>
            <div class="data-grid">
              <div class="data-item"><div class="label">Product Description</div><div class="value">${esc(pp.productDescription)}</div></div>
              <div class="data-item"><div class="label">Particle Size</div><div class="value">${esc(pp.particleSize)}</div></div>
              <div class="data-item"><div class="label">Density</div><div class="value">${esc(pp.density)} g/cm&sup3;</div></div>
              <div class="data-item"><div class="label">Water Content</div><div class="value">${esc(pp.waterContent)}</div></div>
              <div class="data-item"><div class="label">Corrosiveness</div><div class="value">${esc(pp.corrosiveness)}</div></div>
            </div>

            <h4 style="color:#1a365d;margin:16px 0 8px;font-size:14px">Part 2: Packaging Specifications</h4>
            <div class="data-grid" style="grid-template-columns:1fr">
              <div class="data-item"><div class="label">Primary Bags</div><div class="value">${primaryBagsHtml || 'N/A'}</div></div>
              <div class="data-item"><div class="label">Master Bags</div><div class="value">${masterBagsHtml || 'N/A'}</div></div>
            </div>

            <h4 style="color:#1a365d;margin:16px 0 8px;font-size:14px">Part 3: Process Parameters</h4>
            <div class="data-grid">
              <div class="data-item"><div class="label">Packaging Process</div><div class="value">${esc(proc.packagingProcess)}</div></div>
              <div class="data-item"><div class="label">Primary Speed</div><div class="value">${esc(proc.primarySpeed)} pouches/min</div></div>
              <div class="data-item"><div class="label">Secondary Speed</div><div class="value">${esc(proc.secondarySpeed)} pouches/min</div></div>
              <div class="data-item"><div class="label">Weighing Accuracy</div><div class="value">${esc(proc.weighingAccuracy)}</div></div>
              <div class="data-item"><div class="label">Counting Accuracy</div><div class="value">${esc(proc.countingAccuracy)}</div></div>
              <div class="data-item"><div class="label">Sealing Type</div><div class="value">${esc(proc.sealingType)}</div></div>
              <div class="data-item"><div class="label">Stacking Pattern</div><div class="value">${esc(proc.stackingPattern)}</div></div>
              <div class="data-item"><div class="label">Palletizing</div><div class="value">${esc(proc.palletizing) || '-'}</div></div>
            </div>
          </details>
        </div>`;
      }).join('');
    }

    function esc(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function downloadOne(idx) {
      const submissions = getSubmissions();
      const data = submissions[idx];
      if (!data) return;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VBIB_Questionnaire_${data.id || idx}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function deleteOne(idx) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      const submissions = getSubmissions();
      submissions.splice(idx, 1);
      localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(submissions));
      renderSubmissions();
    }

    function exportAll() {
      const submissions = getSubmissions();
      if (submissions.length === 0) { alert('No submissions to export.'); return; }
      const blob = new Blob([JSON.stringify(submissions, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `VBIB_All_Submissions_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          const submissions = getSubmissions();
          if (Array.isArray(data)) {
            data.forEach(item => submissions.push(item));
          } else {
            submissions.push(data);
          }
          localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(submissions));
          renderSubmissions();
          alert('Import successful!');
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Initial render
    renderSubmissions();
  </script>
</body>
</html>
